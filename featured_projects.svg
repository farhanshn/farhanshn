
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-label="Farhan's Featured Projects" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#030B19"></stop>
    <stop offset="1" stop-color="#0A2040"></stop>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#0877C9"></stop>
    <stop offset="1" stop-color="#42D9FF"></stop>
  </linearGradient>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M30 0H0V30" fill="none" stroke="#1A4971" stroke-width=".6" opacity=".4"></path>
  </pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="blur"></feGaussianBlur>
    <feMerge><feMergeNode in="blur"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
  </filter>
  <style>
    text {font-family:'Courier New',monospace;fill:#E5F4FF}
    .muted {fill:#799DBD}
    .cyan {fill:#42D9FF}
    .card {fill:#091A30;stroke:#17466C;stroke-width:1.2}
    .heading {font-size:13px;font-weight:bold;fill:#65CFFF}
    .desc {font-size:11px;fill:#B5CBE0}
    .tag {font-size:9px;fill:#42D9FF}
    .small {font-size:9px;letter-spacing:1px}
    .project {opacity:0;animation:appear .8s ease forwards}
    @keyframes appear {to{opacity:1}}
    .border {fill:none;stroke:#42D9FF;stroke-width:1.4;stroke-dasharray:50 500;animation:borderMove 5s linear infinite;filter:url(#glow)}
    @keyframes borderMove {to{stroke-dashoffset:-550}}
    .pulse {animation:pulse 2s ease-in-out infinite}
    @keyframes pulse {50%{opacity:.25}}
    .scan {animation:scan 6s linear infinite}
    @keyframes scan {from{transform:translateY(0)}to{transform:translateY(600px)}}
    .dot {fill:#42D9FF}
  </style>
</defs>

<!-- Background -->
<rect width="900" height="650" rx="10" fill="url(#bg)"></rect>
<rect width="900" height="650" rx="10" fill="url(#grid)"></rect>

<!-- Header -->
<text x="26" y="37" font-size="20" font-weight="bold" letter-spacing="2">FEATURED_PROJECTS.exe</text>
<text x="874" y="36" text-anchor="end" class="small muted">PORTFOLIO // 2026</text>
<path d="M22 58H878" stroke="url(#blue)" stroke-width="1.5" filter="url(#glow)"></path>
<circle cx="862" cy="76" r="3" class="dot pulse"></circle>
<text x="850" y="80" text-anchor="end" class="small cyan">6 PROJECTS LOADED</text>
<text x="26" y="80" class="small muted">EXPLORING MACHINE LEARNING · DEEP LEARNING · COMPUTER VISION</text>

